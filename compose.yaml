name: campus-booking
services:
  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus-local}
    volumes: [identity-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U campus -d identity"]
      interval: 3s
      retries: 20
  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus-local}
    volumes: [booking-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U campus -d booking"]
      interval: 3s
      retries: 20
  identity:
    image: campus-booking:local
    pull_policy: never
    command: [node, dist/server/identity.js]
    environment:
      DATABASE_URL: postgresql://campus:${DB_PASSWORD:-campus-local}@identity-db:5432/identity
      INTERNAL_KEY: ${INTERNAL_KEY:-local-development-only}
      SEED_DEMO: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Campus2026!}
      PORT: "3001"
    depends_on:
      identity-db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      retries: 15
  booking:
    image: campus-booking:local
    pull_policy: never
    command: [node, dist/server/booking.js]
    environment:
      DATABASE_URL: postgresql://campus:${DB_PASSWORD:-campus-local}@booking-db:5432/booking
      IDENTITY_URL: http://identity:3001
      INTERNAL_KEY: ${INTERNAL_KEY:-local-development-only}
      SEED_DEMO: "true"
      PORT: "3002"
    depends_on:
      booking-db: { condition: service_healthy }
      identity: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      retries: 15
  gateway:
    build: .
    image: campus-booking:local
    command: [node, dist/server/gateway.js]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      IDENTITY_URL: http://identity:3001
      BOOKING_URL: http://booking:3002
      INTERNAL_KEY: ${INTERNAL_KEY:-local-development-only}
      PORT: "3000"
    depends_on:
      identity: { condition: service_healthy }
      booking: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      retries: 15
volumes:
  identity-data:
  booking-data:
